name: Build and publish Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION_NAME="${GITHUB_REF_NAME#v}"
            RELEASE_TAG="${GITHUB_REF_NAME}"
            SHOULD_RELEASE=true
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            VERSION_NAME="0.1.${GITHUB_RUN_NUMBER}"
            RELEASE_TAG="android-v${VERSION_NAME}"
            SHOULD_RELEASE=true
          else
            VERSION_NAME="0.1.0-ci.${GITHUB_RUN_NUMBER}"
            RELEASE_TAG=""
            SHOULD_RELEASE=false
          fi
          VERSION_CODE="${GITHUB_RUN_NUMBER}"
          echo "name=${VERSION_NAME}" >> "${GITHUB_OUTPUT}"
          echo "code=${VERSION_CODE}" >> "${GITHUB_OUTPUT}"
          echo "tag=${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"
          echo "should_release=${SHOULD_RELEASE}" >> "${GITHUB_OUTPUT}"
          echo "Release tag: ${RELEASE_TAG:-none}; version: ${VERSION_NAME} (${VERSION_CODE})"

      - name: Prepare self-signed release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SECRET_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SECRET_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SHOULD_RELEASE: ${{ steps.version.outputs.should_release }}
        run: |
          set -euo pipefail
          if [[ "${SHOULD_RELEASE}" == "true" ]]; then
            MISSING=()
            [[ -n "${KEYSTORE_BASE64}" ]] || MISSING+=("ANDROID_KEYSTORE_BASE64")
            [[ -n "${SECRET_STORE_PASSWORD}" ]] || MISSING+=("ANDROID_KEYSTORE_PASSWORD")
            [[ -n "${SECRET_KEY_PASSWORD}" ]] || MISSING+=("ANDROID_KEY_PASSWORD")
            if (( ${#MISSING[@]} )); then
              echo "::error::Release builds require persistent signing secrets: ${MISSING[*]}" >&2
              exit 1
            fi
          fi
          KEYSTORE_PATH="ci-release.jks"
          if [[ -n "${KEYSTORE_BASE64}" ]]; then
            echo "Using repository-configured signing keystore."
            printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > "${KEYSTORE_PATH}"
            STORE_PASSWORD="${SECRET_STORE_PASSWORD}"
            KEY_ALIAS="${SECRET_KEY_ALIAS:-codex-web}"
            KEY_PASSWORD="${SECRET_KEY_PASSWORD}"
          else
            echo "No signing secrets configured; generating an ephemeral self-signed key."
            STORE_PASSWORD="$(openssl rand -hex 20)"
            KEY_ALIAS="codex-web"
            KEY_PASSWORD="${STORE_PASSWORD}"
            keytool -genkeypair \
              -keystore "${KEYSTORE_PATH}" \
              -storetype PKCS12 \
              -storepass "${STORE_PASSWORD}" \
              -keypass "${KEY_PASSWORD}" \
              -alias "${KEY_ALIAS}" \
              -keyalg RSA \
              -keysize 4096 \
              -validity 10000 \
              -dname "CN=Codex Web Android, OU=Self-hosted, O=Codex Web Android, L=Local, ST=Local, C=US"
          fi
          chmod 600 "${KEYSTORE_PATH}"
          {
            echo "ANDROID_KEYSTORE_PATH=${KEYSTORE_PATH}"
            echo "ANDROID_KEYSTORE_PASSWORD=${STORE_PASSWORD}"
            echo "ANDROID_KEY_ALIAS=${KEY_ALIAS}"
            echo "ANDROID_KEY_PASSWORD=${KEY_PASSWORD}"
          } >> "${GITHUB_ENV}"

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build signed release APK
        run: |
          ./gradlew assembleRelease \
            -PversionName="${{ steps.version.outputs.name }}" \
            -PversionCode="${{ steps.version.outputs.code }}" \
            --stacktrace

      - name: Verify APK and collect release artifact
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "${APK}"
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --verbose --print-certs "${APK}"
          mkdir -p dist
          OUT_NAME="codex-web-android-${{ steps.version.outputs.name }}.apk"
          cp "${APK}" "dist/${OUT_NAME}"
          (cd dist && sha256sum "${OUT_NAME}" > "${OUT_NAME}.sha256")

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: codex-web-android-${{ steps.version.outputs.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        if: steps.version.outputs.should_release == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          NOTES="Self-signed APK for Codex Web Android ${VERSION_NAME}.

          Install it on an Android 8.0+ device after enabling installs from unknown sources. The APK is signed with a self-signed certificate and is not distributed through Google Play.

          Configure ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD repository secrets to keep a stable signing key across releases."
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" dist/* --clobber
          else
            gh release create "${RELEASE_TAG}" dist/* \
              --title "Codex Web Android ${VERSION_NAME}" \
              --notes "${NOTES}" \
              --latest
          fi
